<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fundația Nicoleta | Îngrijire seniori, rezidență premium și servicii dedicate</title>

  <meta name="description" content="Fundația Nicoleta oferă servicii integrate pentru seniori: îngrijire la domiciliu Seniori Acasă, Rezidența Seniorilor Sfântul Laurențiu și soluții specializate Shop Seniori.">

  <meta name="robots" content="index,follow">

  <link rel="canonical" href="https://www.fundatianicoleta.ro/">

  <meta name="theme-color" content="#08271f">

  <style>
    :root {
      --green: #08271f;
      --green2: #0e382d;
      --green3: #16483a;
      --cream: #f6f1e7;
      --cream2: #ede5d6;
      --gold: #a88449;
      --gold2: #c4a367;
      --ink: #18221e;
      --muted: #657069;
      --white: #ffffff;
      --border: rgba(23, 33, 29, .12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.55;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
    }

    .container {
      width: min(1180px, 92%);
      margin: 0 auto;
    }

    .eyebrow {
      display: block;
      color: var(--gold2);
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    h1,
    h2,
    h3 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      margin-top: 0;
    }

    h2 {
      font-size: clamp(35px, 5vw, 57px);
      line-height: 1.08;
      margin-bottom: 22px;
    }

    p {
      margin-top: 0;
    }

    /* TOP BAR */

    .topbar {
      background: #061d17;
      color: #e9e3d9;
      font-size: 13px;
    }

    .topbar-inner {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .topbar a {
      text-decoration: none;
    }

    /* HEADER */

    .site-header {
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid #e8e2d8;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navrow {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brandmark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 28px;
    }

    .brandtext {
      display: flex;
      flex-direction: column;
    }

    .brandtext strong {
      font-family: Georgia, serif;
      font-size: 20px;
      line-height: 1.1;
    }

    .brandtext span {
      margin-top: 5px;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .desktop-nav a {
      text-decoration: none;
      font-size: 14px;
      color: #29342f;
    }

    .desktop-nav a:hover {
      color: var(--gold);
    }

    .nav-contact {
      background: var(--green);
      color: white !important;
      padding: 11px 19px;
      border-radius: 999px;
    }

    /* HERO */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 20%, rgba(196,163,103,.20), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(48,112,89,.38), transparent 35%),
        linear-gradient(135deg, #08271f 0%, #0d362c 58%, #061c16 100%);
      color: white;
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -160px;
      bottom: -210px;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      min-height: 690px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 65px;
      align-items: center;
      padding: 78px 0;
    }

    .hero h1 {
      margin: 0 0 26px;
      font-size: clamp(52px, 7.2vw, 86px);
      line-height: .99;
      max-width: 800px;
    }

    .hero-lead {
      max-width: 720px;
      color: #e4ebe7;
      font-size: 19px;
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-block;
      padding: 14px 23px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-light {
      background: white;
      color: var(--green);
    }

    .btn-outline {
      color: white;
      border: 1px solid rgba(255,255,255,.45);
    }

    .hero-points {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
    }

    .hero-point {
      border-left: 1px solid var(--gold2);
      padding-left: 14px;
    }

    .hero-point strong {
      display: block;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .hero-point span {
      color: #cad6d1;
      font-size: 13px;
    }

    .hero-card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 26px;
      padding: 34px;
      backdrop-filter: blur(12px);
    }

    .hero-card .large-n {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      border: 1px solid var(--gold2);
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 48px;
      margin-bottom: 50px;
    }

    .hero-card h3 {
      font-size: 31px;
      line-height: 1.12;
      margin-bottom: 15px;
    }

    .hero-card p {
      color: #dae4df;
      margin-bottom: 0;
    }

    /* TRUST BAR */

    .trustbar {
      background: #101d19;
      color: white;
    }

    .trustgrid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
    }

    .trustitem {
      padding: 28px 25px;
      border-right: 1px solid rgba(255,255,255,.1);
    }

    .trustitem:last-child {
      border-right: 0;
    }

    .trustitem strong {
      display: block;
      font-family: Georgia, serif;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .trustitem span {
      color: #b9c6c1;
      font-size: 13px;
    }

    /* ECOSYSTEM */

    .section {
      padding: 95px 0;
    }

    .section-soft {
      background: var(--cream);
    }

    .section-dark {
      background: var(--green);
      color: white;
    }

    .section-head {
      max-width: 810px;
      margin-bottom: 45px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 17px;
      max-width: 690px;
    }

    .section-dark .section-head p {
      color: #d7e0dc;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .service-card {
      position: relative;
      overflow: hidden;
      min-height: 390px;
      padding: 35px;
      border-radius: 24px;
      background: white;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .service-card.dark {
      background: #0d3027;
      color: white;
      border-color: rgba(255,255,255,.12);
    }

    .service-card.gold {
      background: #a17d43;
      color: white;
      border: 0;
    }

    .service-number {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .14em;
      margin-bottom: 65px;
    }

    .service-card.dark .service-number,
    .service-card.gold .service-number {
      color: #e0c795;
    }

    .service-card h3 {
      font-size: 36px;
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .service-card p {
      color: #59645e;
    }

    .service-card.dark p,
    .service-card.gold p {
      color: rgba(255,255,255,.83);
    }

    .service-link {
      margin-top: auto;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    /* PHILOSOPHY */

    .signature {
      background: #f0e9dc;
      padding: 105px 0;
    }

    .signature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .signature-copy {
      max-width: 600px;
    }

    .signature-copy p {
      font-size: 17px;
      color: #59635e;
    }

    .signature-quote {
      background: white;
      border-radius: 28px;
      padding: 48px;
      border: 1px solid var(--border);
    }

    .signature-quote blockquote {
      margin: 0;
      font-family: Georgia, serif;
      font-size: 34px;
      line-height: 1.25;
    }

    /* RESIDENCE */

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 75px;
      align-items: center;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin-top: 30px;
    }

    .feature {
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 15px;
      padding: 18px;
    }

    .feature strong {
      display: block;
      color: #d0b276;
      margin-bottom: 4px;
    }

    .feature span {
      color: #d7e1dd;
      font-size: 14px;
    }

    .residence-panel {
      min-height: 520px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 25% 20%, rgba(207,179,119,.42), transparent 17%),
        radial-gradient(circle at 70% 67%, rgba(74,139,112,.4), transparent 28%),
        linear-gradient(145deg,#173e33,#071f19);
      padding: 45px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .residence-panel .label {
      color: #d6ba80;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .17em;
    }

    .residence-panel h3 {
      font-size: 42px;
      margin: 12px 0 8px;
    }

    .residence-panel p {
      color: #dce5e1;
      margin: 0;
    }

    /* SENIORI ACASA */

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
      margin-top: 40px;
    }

    .process-card {
      min-height: 270px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
    }

    .process-card .num {
      color: var(--gold);
      letter-spacing: .14em;
      font-size: 12px;
    }

    .process-card h3 {
      font-size: 34px;
      margin: 36px 0 15px;
    }

    /* SHOP */

    .shop-panel {
      border-radius: 30px;
      min-height: 500px;
      background:
        linear-gradient(145deg,#f4efe4,#ded4c1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .shop-symbol {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: white;
      border: 1px solid #d8c9ae;
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-size: 72px;
      color: var(--green);
      box-shadow: 0 22px 55px rgba(0,0,0,.08);
    }

    /* CTA */

    .cta {
      background: #95713c;
      color: white;
      padding: 90px 0;
      text-align: center;
    }

    .cta-inner {
      max-width: 900px;
      margin: auto;
    }

    .cta h2 {
      font-size: clamp(38px,5vw,60px);
    }

    .cta p {
      max-width: 680px;
      margin: 0 auto 28px;
      color: #f6ede0;
      font-size: 17px;
    }

    /* FOOTER */

    .footer {
      background: #051e18;
      color: #d8e2de;
      padding: 60px 0 28px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 45px;
    }

    .footer h3,
    .footer h4 {
      color: white;
    }

    .footer h3 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .footer h4 {
      font-family: Arial, sans-serif;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .footer p,
    .footer a {
      color: #b9c6c1;
      font-size: 14px;
    }

    .footer a {
      display: block;
      text-decoration: none;
      margin: 8px 0;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.1);
      margin-top: 45px;
      padding-top: 20px;
      font-size: 12px;
      color: #80928a;
    }

    /* CALL BUTTON */

    .floating-call {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 200;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--green);
      color: white;
      text-decoration: none;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
      font-size: 22px;
    }

    /* MOBILE */

    @media (max-width: 900px) {
      .hero-inner,
      .grid2,
      .signature-grid {
        grid-template-columns: 1fr;
      }

      .hero-inner {
        min-height: auto;
        gap: 35px;
      }

      .hero-card {
        display: none;
      }

      .service-grid,
      .process-grid {
        grid-template-columns: 1fr;
      }

      .trustgrid {
        grid-template-columns: repeat(2,1fr);
      }

      .footer-grid {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media (max-width: 700px) {
      .topbar-inner {
        justify-content: center;
        text-align: center;
      }

      .topbar-right {
        display: none;
      }

      .navrow {
        min-height: 72px;
      }

      .desktop-nav a:not(.nav-contact) {
        display: none;
      }

      .brandmark {
        width: 42px;
        height: 42px;
        font-size: 24px;
      }

      .brandtext strong {
        font-size: 17px;
      }

      .brandtext span {
        font-size: 8px;
      }

      .hero-inner {
        padding: 65px 0 70px;
      }

      .hero h1 {
        font-size: 49px;
      }

      .hero-lead {
        font-size: 17px;
      }

      .hero-points {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .section,
      .signature {
        padding: 70px 0;
      }

      .service-card {
        min-height: 330px;
      }

      .feature-grid {
        grid-template-columns: 1fr;
      }

      .trustgrid {
        grid-template-columns: 1fr 1fr;
      }

      .trustitem {
        padding: 22px 18px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

      .signature-quote {
        padding: 32px;
      }

      .signature-quote blockquote {
        font-size: 28px;
      }

      .residence-panel {
        min-height: 390px;
        padding: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="container topbar-inner">
      <span>Fundația Nicoleta · servicii integrate pentru seniori</span>
      <span class="topbar-right">
        Petrești · Sebeș · Alba ·
        <a href="tel:+40746898421">0746 898 421</a>
      </span>
    </div>
  </div>

  <header class="site-header">
    <div class="container navrow">

      <a href="/" class="brand">
        <span class="brandmark">N</span
