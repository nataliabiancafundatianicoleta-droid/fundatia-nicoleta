<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Despre noi | Fundația Nicoleta – Servicii pentru seniori</title>

  <meta name="description" content="Descoperă Fundația Nicoleta și serviciile dedicate seniorilor: îngrijire la domiciliu, Rezidența Seniorilor Sfântul Laurențiu și soluții specializate pentru îngrijirea persoanelor vârstnice.">

  <meta name="robots" content="index,follow">

  <style>
    :root{
      --green:#102c25;
      --green2:#173c32;
      --cream:#f7f3ea;
      --gold:#9a7941;
      --ink:#17211d;
      --white:#ffffff;
      --soft:#eee8dc;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--ink);
      background:#fff;
      line-height:1.65;
    }

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    /* HEADER */

    header{
      background:#fff;
      border-bottom:1px solid #e6e1d8;
      position:sticky;
      top:0;
      z-index:50;
    }

    .nav{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:var(--ink);
    }

    .brandmark{
      display:grid;
      place-items:center;
      width:44px;
      height:44px;
      border:1px solid var(--gold);
      border-radius:50%;
      font-family:Georgia,serif;
      font-size:25px;
    }

    .brandtext{
      display:flex;
      flex-direction:column;
    }

    .brandtext strong{
      font-family:Georgia,serif;
      font-size:19px;
    }

    .brandtext span{
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    nav{
      display:flex;
      gap:22px;
      align-items:center;
    }

    nav a{
      color:var(--ink);
      text-decoration:none;
      font-size:14px;
    }

    .contact{
      background:var(--green);
      color:#fff;
      padding:10px 18px;
      border-radius:24px;
    }

    /* HERO */

    .hero{
      background:var(--green);
      color:#fff;
      padding:95px 0 100px;
    }

    .eyebrow{
      color:#c6a66d;
      text-transform:uppercase;
      letter-spacing:.2em;
      font-size:11px;
      font-weight:bold;
      margin-bottom:18px;
    }

    .hero h1{
      font-family:Georgia,serif;
      font-weight:400;
      font-size:clamp(42px,7vw,76px);
      line-height:1.05;
      max-width:900px;
      margin:0 0 28px;
    }

    .hero p{
      max-width:720px;
      font-size:18px;
      color:#e7ece9;
      margin:0;
    }

    /* INTRO */

    .intro{
      padding:90px 0;
      background:var(--cream);
    }

      display:grid;
      grid-template-columns:1fr
